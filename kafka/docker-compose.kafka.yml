# Pedidos360 - Kafka (3 Zookeeper + 3 brokers). Versiones fijadas: 7.9.x es la ultima serie de Confluent con ZooKeeper.
name: pedidos360-kafka

x-zk: &zk
  image: confluentinc/cp-zookeeper:7.9.0
  networks: [kafka-net]
  restart: unless-stopped

x-zk-env: &zk-env
  ZOOKEEPER_CLIENT_PORT: 2181
  ZOOKEEPER_TICK_TIME: 2000
  ZOOKEEPER_INIT_LIMIT: 5
  ZOOKEEPER_SYNC_LIMIT: 2
  ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
  KAFKA_HEAP_OPTS: -Xms256m -Xmx256m

x-broker-env: &broker-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m

x-broker: &broker
  image: confluentinc/cp-kafka:7.9.0
  networks: [kafka-net]
  restart: unless-stopped

services:
  zookeeper1:
    <<: *zk
    container_name: zookeeper1
    environment: { <<: *zk-env, ZOOKEEPER_SERVER_ID: 1 }
    ports: ["2181:2181"]
  zookeeper2:
    <<: *zk
    container_name: zookeeper2
    environment: { <<: *zk-env, ZOOKEEPER_SERVER_ID: 2 }
    ports: ["2182:2181"]
  zookeeper3:
    <<: *zk
    container_name: zookeeper3
    environment: { <<: *zk-env, ZOOKEEPER_SERVER_ID: 3 }
    ports: ["2183:2181"]

  kafka1:
    <<: *broker
    container_name: kafka1
    depends_on: [zookeeper1, zookeeper2, zookeeper3]
    ports: ["9092:9092"]
    environment:
      <<: *broker-env
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://${KAFKA_HOST:-localhost}:9092
  kafka2:
    <<: *broker
    container_name: kafka2
    depends_on: [zookeeper1, zookeeper2, zookeeper3]
    ports: ["9093:9092"]
    environment:
      <<: *broker-env
      KAFKA_BROKER_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://${KAFKA_HOST:-localhost}:9093
  kafka3:
    <<: *broker
    container_name: kafka3
    depends_on: [zookeeper1, zookeeper2, zookeeper3]
    ports: ["9094:9092"]
    environment:
      <<: *broker-env
      KAFKA_BROKER_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://${KAFKA_HOST:-localhost}:9094

  # Crea los topicos una sola vez y termina.
  kafka-init:
    image: confluentinc/cp-kafka:7.9.0
    container_name: kafka-init
    networks: [kafka-net]
    depends_on: [kafka1, kafka2, kafka3]
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        BS=kafka1:29092,kafka2:29092,kafka3:29092
        echo "Esperando brokers..."
        until kafka-broker-api-versions --bootstrap-server $$BS 2>/dev/null | grep -c "id:" | grep -q 3; do sleep 3; done
        # Topico 1: eventos de dominio, retencion 7 dias, ordenado por pedidoId (clave)
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic pedidos.eventos \
          --partitions 3 --replication-factor 3 \
          --config cleanup.policy=delete --config retention.ms=604800000 --config min.insync.replicas=2
        # Topico 2: ultimo estado por pedido (compactado)
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic pedidos.estado \
          --partitions 3 --replication-factor 3 \
          --config cleanup.policy=compact --config min.insync.replicas=2
        kafka-topics --bootstrap-server $$BS --describe
        echo "Topicos listos."

networks:
  kafka-net:
    name: pedidos360-kafka-net