# Aplicacion completa en la nube. Kafka y RabbitMQ corren en sus propios compose
# (carpetas kafka y rabbitmq) y aqui nos unimos a sus redes.
x-java-build: &java-build
  dockerfile_inline: |
    FROM maven:3.9-eclipse-temurin-17 AS build
    WORKDIR /app
    COPY pom.xml .
    COPY src ./src
    RUN mvn -B -q -DskipTests package
    FROM eclipse-temurin:17-jre
    WORKDIR /app
    COPY --from=build /app/target/*.jar app.jar
    ENTRYPOINT ["java", "-jar", "app.jar"]

x-java: &java
  restart: unless-stopped
  environment: &java-env
    JAVA_TOOL_OPTIONS: "-Xmx300m"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: pedidos360
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [app]

  pedidos-service:
    <<: *java
    build:
      <<: *java-build
      context: ../../pedidos360-backend/pedidos-service
    environment:
      <<: *java-env
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: pedidos360
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID_BACKEND: ${AZURE_CLIENT_ID_BACKEND}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [app, kafka, rabbit]

  bff-service:
    <<: *java
    build:
      <<: *java-build
      context: ../../pedidos360-backend/bff-service
    environment:
      <<: *java-env
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID_BACKEND: ${AZURE_CLIENT_ID_BACKEND}
      PEDIDOS_SERVICE_URL: http://pedidos-service:8081
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
    networks: [app]

  notificaciones-service:
    <<: *java
    build:
      <<: *java-build
      context: ../../pedidos360-backend/notificaciones-service
    environment:
      <<: *java-env
      KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
    networks: [app, kafka]

  kafka-admin-service:
    <<: *java
    build:
      <<: *java-build
      context: ../../pedidos360-backend/kafka-admin-service
    environment:
      <<: *java-env
      KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
    networks: [app, kafka]

  rabbit-admin-service:
    <<: *java
    build:
      <<: *java-build
      context: ../../pedidos360-backend/rabbit-admin-service
    environment:
      <<: *java-env
      RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    networks: [app, rabbit]

  frontend:
    restart: unless-stopped
    build:
      context: ../../pedidos360-frontend
      args:
        SITE_URL: https://${DOMAIN}
        API_BASE_URL: ${API_BASE_URL:-https://${DOMAIN}/api/v1}
      dockerfile_inline: |
        FROM node:20-alpine AS build
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci || npm install
        COPY . .
        ARG SITE_URL
        ARG API_BASE_URL
        RUN sed -i "s#msalRedirectUri: '[^']*'#msalRedirectUri: '$${SITE_URL}'#; s#apiBaseUrl: '[^']*'#apiBaseUrl: '$${API_BASE_URL}'#" src/environments/environment.ts
        RUN npx ng build
        RUN mkdir /out && if [ -d dist/pedidos360-frontend/browser ]; then cp -r dist/pedidos360-frontend/browser/. /out; else cp -r dist/pedidos360-frontend/. /out; fi
        FROM caddy:2-alpine
        COPY --from=build /out /srv/frontend
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [app]

networks:
  app: {}
  kafka:
    name: pedidos360-kafka-net
    external: true
  rabbit:
    name: rabbitmq_default
    external: true

volumes:
  mysql-data:
  caddy-data: